[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
log_cli = true
log_cli_level = WARNING
markers =
    integration: marks tests that require live services (ChromaDB, Gemini API)
    unit: marks fast, isolated unit tests
